name: Ubuntu

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: create cmake project
      run: cmake -B build -S .
    - name: build cmake project
      run: cmake --build build/ --target all
    - name: execute test
      run: ctest --test-dir build --output-on-failure

  sanitizers:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: configure sanitizer build
      run: cmake -DNOTIDY=ON -DDIRECTEDGRAPH_ENABLE_SANITIZERS=ON -DCMAKE_BUILD_TYPE=Debug -B build-sanitized -S .
    - name: build sanitizer tests
      run: cmake --build build-sanitized --target directed_graph_tests
    - name: execute sanitizer tests
      run: ctest --test-dir build-sanitized --output-on-failure
